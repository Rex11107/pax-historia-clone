<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1f2a33" />
  <title>Regnum Historia</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <main id="start" class="start">
    <div class="start-box">
      <h1>Regnum Historia</h1>
      <p class="start-sub">Europa e Mediterraneo, dal 1° gennaio 1881. Una nazione, un governo, il resto del mondo che risponde.</p>
      <p id="start-status" class="sub">Preparazione della carta…</p>
      <div id="start-actions" class="start-actions"></div>
    </div>
  </main>

  <div id="game" class="game">
    <header class="top">
      <div class="top-id">
        <span id="date" class="date"></span>
        <span id="nation" class="nation"></span>
      </div>
      <div id="stats" class="stats"></div>
      <button id="settings-btn" class="icon-btn" aria-label="Impostazioni">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.4 4.6-.1-1.1 2-1.6-2-3.4-2.4.9a8 8 0 0 0-1.9-1.1L15.6 4h-4l-.4 2.8c-.7.3-1.3.6-1.9 1.1l-2.4-1-2 3.5 2 1.6a7 7 0 0 0 0 2.2l-2 1.6 2 3.4 2.4-.9c.6.5 1.2.8 1.9 1.1l.4 2.6h4l.4-2.6c.7-.3 1.3-.6 1.9-1.1l2.4.9 2-3.4-2-1.7Z"/></svg>
      </button>
    </header>

    <canvas id="map" class="map" aria-label="Carta politica"></canvas>
    <div id="hint" class="hint is-hidden"></div>

    <section id="sheet" class="sheet" aria-live="polite">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="icon-btn" aria-label="Chiudi pannello">✕</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </section>

    <nav class="tabs" aria-label="Sezioni">
      <button data-tab="army">Esercito</button>
      <button data-tab="diplomacy">Diplomazia</button>
      <button data-tab="government">Governo</button>
      <button data-tab="dispatches">Dispacci</button>
      <button id="end-turn" class="end-turn">Fine settimana</button>
    </nav>
  </div>

  <div id="overlay" class="overlay is-hidden" role="status">
    <div class="overlay-box"><div class="spinner" aria-hidden="true"></div><p id="overlay-text"></p></div>
  </div>
  <div id="toasts" class="toasts"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
